<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menctor • Credenciado — Protótipo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* ============================================================
       LECTOR DESIGN SYSTEM TOKENS (light theme padrão)
       ============================================================ */
    :root {
      /* Brand */
      --brand: #F66B0A;
      --brand-hover: #EE5A00;
      --brand-press: #C44700;
      --brand-soft: #FFF4EC;
      --brand-soft-2: #FFE3CF;
      --on-brand: #FFFFFF;

      /* Navy */
      --navy: #00204D;
      --navy-800: #00204D;
      --navy-soft: #EBF0F7;

      /* Ink / neutrals */
      --ink-950: #001026;
      --ink-900: #001A3D;
      --ink-800: #0E2748;
      --ink-700: #243653;
      --ink-600: #3C4A63;
      --ink-500: #5C667C;
      --ink-400: #838DA0;
      --ink-300: #AAB2C2;
      --ink-200: #D3D8E2;
      --ink-100: #E7EAF1;
      --ink-75: #EFF1F6;
      --ink-50: #F6F7FA;
      --white: #FFFFFF;

      /* Surfaces */
      --surface-page: #FBFAF7; /* premium paper */
      --surface-card: #FFFFFF;
      --surface-sunken: #EFF1F6;

      /* Borders */
      --border-subtle: #E7EAF1;
      --border-default: #D3D8E2;
      --border-strong: #AAB2C2;

      /* Semantic */
      --success: #1F9D55;
      --success-soft: #E7F6EE;
      --danger: #E5484D;
      --danger-soft: #FCEBEC;
      --info: #2A6FDB;
      --info-soft: #E9F0FC;
      --warning: #F0A800;
      --warning-soft: #FFF6E0;

      /* Typography */
      --font-display: 'Sora', 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;

      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;
      --text-3xl: 1.875rem;

      --weight-regular: 400;
      --weight-medium: 500;
      --weight-semibold: 600;
      --weight-bold: 700;
      --weight-extra: 800;

      --leading-tight: 1.05;
      --leading-snug: 1.2;
      --leading-normal: 1.5;

      --tracking-tight: -0.015em;
      --tracking-normal: 0;
      --tracking-wide: 0.04em;
      --tracking-caps: 0.12em;

      /* Radii */
      --radius-xs: 6px;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --radius-2xl: 36px;
      --radius-pill: 999px;

      /* Shadows */
      --shadow-xs: 0 1px 2px rgba(20,23,28,0.06);
      --shadow-sm: 0 2px 6px rgba(20,23,28,0.07);
      --shadow-md: 0 8px 20px -6px rgba(20,23,28,0.12);
      --shadow-lg: 0 18px 40px -12px rgba(20,23,28,0.18);
      --shadow-brand: 0 12px 28px -8px rgba(246,107,10,0.35);

      /* Spacing (4px grid) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 32px;
      --space-8: 40px;
      --space-9: 48px;

      /* Motion */
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --dur-fast: 140ms;
      --dur-base: 220ms;
    }

    /* Base resets */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      font-size: var(--text-base);
      line-height: var(--leading-normal);
      color: var(--ink-800);
      background: var(--surface-page);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 { font-family: var(--font-display); font-weight: var(--weight-bold); letter-spacing: var(--tracking-tight); margin: 0; }
    .display { font-family: var(--font-display); letter-spacing: var(--tracking-tight); }
    .eyebrow {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      letter-spacing: var(--tracking-caps);
      text-transform: uppercase;
      color: var(--ink-500);
    }
    .muted { color: var(--ink-500); }
    .text-brand { color: var(--brand); }

    /* Layout */
    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }
    .sidebar {
      background: var(--white);
      border-right: 1px solid var(--border-subtle);
      padding: var(--space-7) var(--space-5);
      display: flex;
      flex-direction: column;
      position: fixed;
      width: 260px;
      height: 100vh;
      z-index: 50;
    }
    .main {
      margin-left: 260px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      height: 68px;
      background: var(--white);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-8);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .content {
      padding: var(--space-8);
      flex: 1;
    }

    /* Logo + Nav */
    .logo {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      font-family: var(--font-display);
      font-weight: var(--weight-extra);
      font-size: 22px;
      letter-spacing: -0.02em;
      color: var(--navy);
      margin-bottom: var(--space-8);
    }
    .logo-mark {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--brand), #FF8526);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 15px; font-weight: 800;
    }
    .nav-item {
      display: flex; align-items: center; gap: var(--space-3);
      padding: 11px 14px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 14.5px;
      color: var(--ink-700);
      cursor: pointer;
      transition: all var(--dur-fast) var(--ease-out);
      margin-bottom: 3px;
    }
    .nav-item:hover { background: var(--brand-soft); color: var(--ink-900); }
    .nav-item.active {
      background: var(--brand);
      color: var(--on-brand);
      box-shadow: var(--shadow-brand);
    }
    .nav-item .icon { width: 18px; height: 18px; opacity: .9; }

    /* Topbar */
    .search {
      width: 340px;
      position: relative;
    }
    .search input {
      width: 100%;
      background: var(--surface-sunken);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      padding: 10px 16px 10px 42px;
      font-size: 14px;
      outline: none;
    }
    .search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(246,107,10,0.1); }
    .search::before {
      content: "⌘"; position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      font-size: 13px; color: var(--ink-400);
    }
    .user-pill {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface-sunken);
      border-radius: 999px;
      padding: 4px 4px 4px 14px;
      font-size: 13px;
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 999px;
      background: linear-gradient(135deg, var(--navy), #1A4173);
      color: white; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px;
    }

    /* Cards & Surfaces */
    .card {
      background: var(--surface-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
      padding: var(--space-6);
    }
    .card-lg { padding: var(--space-7); }
    .section-title {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--ink-900);
    }

    /* Buttons (DS style) */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 14px;
      border-radius: var(--radius-pill);
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), background var(--dur-fast);
      text-decoration: none;
    }
    .btn:active { transform: scale(0.985); }
    .btn-primary {
      background: var(--brand);
      color: var(--on-brand);
      box-shadow: var(--shadow-brand);
    }
    .btn-primary:hover { background: var(--brand-hover); }
    .btn-secondary {
      background: var(--white);
      color: var(--ink-800);
      border: 1px solid var(--border-default);
    }
    .btn-secondary:hover { background: var(--brand-soft); border-color: var(--brand-soft-2); }
    .btn-ghost {
      background: transparent;
      color: var(--ink-600);
      padding: 8px 14px;
    }
    .btn-ghost:hover { background: var(--brand-soft); color: var(--ink-800); }
    .btn-sm { font-size: 13px; padding: 7px 14px; }

    /* Badges & Pills */
    .pill {
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
      letter-spacing: .5px;
      padding: 3px 11px;
      border-radius: 999px;
      background: var(--ink-100);
      color: var(--ink-700);
    }
    .pill-brand { background: var(--brand-soft); color: var(--brand); }
    .pill-success { background: var(--success-soft); color: var(--success); }
    .pill-warning { background: var(--warning-soft); color: var(--warning); }
    .pill-danger { background: var(--danger-soft); color: var(--danger); }
    .pill-info { background: var(--info-soft); color: var(--info); }

    /* KPI / Metric */
    .metric {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 20px 22px;
      box-shadow: var(--shadow-sm);
    }
    .metric-value {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
      line-height: 1.05;
      color: var(--ink-900);
    }
    .metric-label { font-size: 13px; font-weight: 600; color: var(--ink-500); margin-top: 4px; }
    .metric-delta { font-size: 12.5px; font-weight: 600; margin-top: 6px; }
    .metric-delta.up { color: var(--success); }
    .metric-delta.down { color: var(--danger); }

    /* Kanban */
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: var(--space-4);
      align-items: start;
    }
    .kanban-col {
      background: var(--surface-sunken);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      min-height: 520px;
    }
    .kanban-col-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 4px 10px;
      font-weight: 700;
      font-size: 13px;
      color: var(--ink-600);
    }
    .kanban-col-header .count {
      background: var(--white); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700;
    }
    .kanban-card {
      background: var(--white);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px 15px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-xs);
      cursor: grab;
      transition: box-shadow var(--dur-fast), transform var(--dur-fast);
    }
    .kanban-card:hover { box-shadow: var(--shadow-md); }
    .kanban-card:active { cursor: grabbing; transform: scale(1.01); }
    .kanban-card .empresa { font-weight: 700; font-size: 14.5px; color: var(--ink-900); }
    .kanban-card .meta { font-size: 12px; color: var(--ink-500); margin-top: 3px; }
    .kanban-card .valor { font-family: var(--font-display); font-weight: 700; color: var(--navy); font-size: 15px; margin-top: 8px; }
    .kanban-card .tags { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }

    /* Stepper / Timeline */
    .stepper {
      display: flex;
      gap: 0;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .step {
      display: flex; flex-direction: column; align-items: center; min-width: 92px; position: relative; flex: 1;
    }
    .step:not(:last-child)::after {
      content: ''; position: absolute; top: 15px; left: 52%; right: -52%;
      height: 3px; background: var(--border-default);
    }
    .step.completed:not(:last-child)::after { background: var(--success); }
    .step-circle {
      width: 30px; height: 30px;
      border-radius: 999px;
      border: 2px solid var(--border-default);
      background: var(--white);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      color: var(--ink-500);
      z-index: 1;
    }
    .step.current .step-circle {
      border-color: var(--brand);
      background: var(--brand);
      color: white;
      box-shadow: 0 0 0 4px rgba(246,107,10,0.2);
    }
    .step.completed .step-circle {
      border-color: var(--success);
      background: var(--success);
      color: white;
    }
    .step-label {
      font-size: 10.5px;
      font-weight: 600;
      margin-top: 6px;
      text-align: center;
      color: var(--ink-600);
      max-width: 82px;
      line-height: 1.15;
    }
    .step.current .step-label { color: var(--brand); font-weight: 700; }
    .step.completed .step-label { color: var(--success); }

    /* Filters */
    .filter-bar {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      margin-bottom: var(--space-5);
    }
    .seg-control {
      display: inline-flex;
      background: var(--surface-sunken);
      border-radius: var(--radius-pill);
      padding: 3px;
    }
    .seg-btn {
      padding: 6px 15px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      transition: all var(--dur-fast);
    }
    .seg-btn.active {
      background: var(--white);
      box-shadow: var(--shadow-xs);
      color: var(--ink-900);
    }
    .input {
      background: var(--white);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 9px 13px;
      font-size: 14px;
    }
    .input:focus { outline: none; border-color: var(--brand); }

    /* Table / List */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-500);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .data-table td { padding: 14px 12px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
    .row-click { cursor: pointer; }
    .row-click:hover { background: var(--brand-soft); }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 16, 38, 0.55);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
      background: var(--white);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-xl);
      width: 100%; max-width: 620px;
      max-height: 86vh;
      overflow: auto;
    }
    .modal-header {
      padding: 20px 24px 12px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-body { padding: 24px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border-subtle); display: flex; gap: 10px; justify-content: flex-end; }

    /* Toast */
    .toast-container {
      position: fixed; bottom: 24px; right: 24px; z-index: 200;
      display: flex; flex-direction: column; gap: 8px;
    }
    .toast {
      background: var(--ink-900);
      color: white;
      padding: 12px 18px;
      border-radius: var(--radius-lg);
      font-size: 13.5px;
      box-shadow: var(--shadow-lg);
      display: flex; align-items: center; gap: 10px;
    }

    /* Misc */
    .divider { height: 1px; background: var(--border-subtle); margin: 20px 0; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .stat-inline { display: flex; align-items: baseline; gap: 8px; }
    .progress {
      height: 6px; background: var(--ink-100); border-radius: 999px; overflow: hidden;
    }
    .progress > span { display: block; height: 100%; background: var(--brand); }
    .empty-state {
      padding: 48px 20px; text-align: center; color: var(--ink-500);
    }

    /* Responsive note */
    @media (max-width: 1100px) {
      .kanban-board { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-mark">M</div>
        <div>Menctor</div>
      </div>

      <div style="margin-bottom: 8px; font-size: 10px; letter-spacing: .08em; font-weight:700; color:#5C667C; padding-left:4px;">CREDENCIADO</div>

      <div onclick="navigateTo('dashboard')" class="nav-item active" id="nav-dashboard">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M19 9l-5 5-4-4-3 3"/></svg>
        <span>Visão Geral</span>
      </div>
      <div onclick="navigateTo('pipeline')" class="nav-item" id="nav-pipeline">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Pipeline CRM</span>
      </div>
      <div onclick="navigateTo('implantacao')" class="nav-item" id="nav-implantacao">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Gestão de Implantação</span>
      </div>

      <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-subtle); font-size: 12px;">
        <div class="nav-item" style="margin-bottom:0; font-size:13px;" onclick="showToast('Acesso rápido • Clientes (em breve)')">
          <svg class="icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/></svg>
          <span>Clientes</span>
        </div>
        <div style="font-size: 11px; padding: 8px 4px 0; color: var(--ink-400);">Lector Tecnologia • 2026</div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <!-- TOPBAR -->
      <div class="topbar">
        <div style="display:flex; align-items:center; gap:16px;">
          <div id="view-title" style="font-family: var(--font-display); font-size: 21px; font-weight: 700; color: var(--ink-900);">Visão Geral</div>
          <div id="view-subtitle" class="eyebrow" style="margin-top:3px;">06 de julho de 2026 • Semana 27</div>
        </div>

        <div style="display:flex; align-items:center; gap:12px;">
          <div class="search">
            <input id="global-search" type="text" placeholder="Buscar empresas, contatos ou oportunidades..." oninput="handleGlobalSearch()">
          </div>

          <button onclick="refreshAll()" class="btn btn-secondary btn-sm" title="Atualizar dados simulados">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 013.5-7.1"/><path d="M3 12a9 9 0 019 9"/><path d="M21 12a9 9 0 01-9 9"/></svg>
            Atualizar
          </button>

          <div class="user-pill">
            <div>
              <div style="font-weight:600; line-height:1;">Alex Mendes</div>
              <div style="font-size:10px; color:#838DA0; margin-top:-1px;">Credenciado • SP</div>
            </div>
            <div class="avatar">AM</div>
          </div>
        </div>
      </div>

      <!-- CONTENT AREA -->
      <div class="content" id="content-area">
        <!-- Dynamically rendered by JS -->
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal-backdrop" class="modal-backdrop" onclick="if (event.target.id === 'modal-backdrop') closeModal()">
    <div class="modal" onclick="event.stopImmediatePropagation()">
      <div class="modal-header">
        <div id="modal-title" style="font-size:18px; font-weight:700;"></div>
        <button onclick="closeModal()" class="btn btn-ghost" style="padding:4px 10px;">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- TOASTS -->
  <div id="toast-container" class="toast-container"></div>

      t.className = 'toast';
      t.innerHTML = `<span>${msg}</span>`;
      c.appendChild(t);
      setTimeout(() => { t.style.transition = 'opacity .2s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 180); }, ms);

    function navigateTo(view) {
      // update nav active
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const nav = document.getElementById('nav-' + view);
      if (nav) nav.classList.add('active');

      const titleEl = document.getElementById('view-title');
      const subEl = document.getElementById('view-subtitle');
      const content = document.getElementById('content-area');

      if (view === 'dashboard') {
        titleEl.textContent = 'Visão Geral';
        subEl.textContent = '06 de julho de 2026 • Semana 27';
        renderDashboard(content);
      } else if (view === 'pipeline') {
        titleEl.textContent = 'Pipeline CRM';
        subEl.textContent = 'Gestão de oportunidades • ' + state.pipeline.length + ' negócios';
        renderPipeline(content);
      } else if (view === 'implantacao') {

        subEl.textContent = 'Acompanhamento NR-1 • ' + state.implantacoes.length + ' projetos ativos';

                  <div style="font-weight:700; font-size:15px; color:${c.risk < 2.0 ? 'var(--success)' : c.risk < 2.5 ? 'var(--warning)' : 'var(--danger)'};">${c.risk}</div>

    // ============================================================
    // PIPELINE KANBAN (draggable + filters)
    // ============================================================
    function getFilteredPipeline() {
      let list = [...state.pipeline];
      if (state.searchTerm) {
        const q = state.searchTerm;
        list = list.filter(p => p.empresa.toLowerCase().includes(q) || p.contato.toLowerCase().includes(q) || p.setor.toLowerCase().includes(q));
      }
      if (state.pipelineFilter !== 'all') {
        list = list.filter(p => p.stage === state.pipelineFilter);
      }
      return list;
    }

    function renderPipeline(container, isRefresh = false) {
      const filtered = getFilteredPipeline();
      const stages = [
        { id: 'lead', label: 'Lead', color: '#838DA0' },
        { id: 'proposta', label: 'Proposta', color: '#2A6FDB' },
        { id: 'contrato', label: 'Contrato', color: '#F0A800' },
        { id: 'aceita', label: 'Aceita', color: '#1F9D55' },
        { id: 'fechado', label: 'Fechado', color: '#00204D' }
      ];

      const valueByStage = (st) => filtered.filter(p=>p.stage===st).reduce((s,p)=>s+p.valor,0);

      let html = `
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
          <div>
            <div style="font-size:13px; color:#5C667C;">Valor total filtrado</div>
            <div style="font-size:26px; font-weight:700; color:var(--navy);">${formatBRL(filtered.reduce((s,p)=>s+p.valor,0))}</div>
          </div>
          <div class="filter-bar">
            <div class="seg-control">
              <div onclick="setPipelineFilter('all')" class="seg-btn ${state.pipelineFilter==='all'?'active':''}">Todos</div>
              <div onclick="setPipelineFilter('lead')" class="seg-btn ${state.pipelineFilter==='lead'?'active':''}">Lead</div>
              <div onclick="setPipelineFilter('proposta')" class="seg-btn ${state.pipelineFilter==='proposta'?'active':''}">Proposta</div>
              <div onclick="setPipelineFilter('contrato')" class="seg-btn ${state.pipelineFilter==='contrato'?'active':''}">Contrato</div>
            </div>
            <button onclick="addNewOpportunity()" class="btn btn-primary btn-sm">+ Nova oportunidade</button>
          </div>
        </div>

        <div class="kanban-board" id="kanban-board">
      `;

      stages.forEach(stage => {
        const cards = filtered.filter(p => p.stage === stage.id);
        const totalVal = valueByStage(stage.id);
        html += `
          <div class="kanban-col" data-stage="${stage.id}" ondrop="dropCard(event)" ondragover="allowDrop(event)">
            <div class="kanban-col-header">
              <div style="color:${stage.color}; font-weight:700;">${stage.label}</div>
              <span class="count">${cards.length}</span>
            </div>
            <div style="font-size:11px; margin-bottom:8px; padding-left:3px;">${formatBRL(totalVal)}</div>
            ${cards.map(card => `
              <div class="kanban-card" draggable="true" ondragstart="dragStart(event, '${card.id}')" onclick="openPipelineDetail('${card.id}', event)">
                <div class="empresa">${card.empresa}</div>
                <div class="meta">${card.contato} • ${card.funcionarios} func.</div>
                <div class="valor">${formatBRL(card.valor)}</div>
                <div class="tags">
                  <span class="pill" style="font-size:10px;">${card.prob}%</span>
                  <span class="pill pill-info" style="font-size:10px;">${card.setor}</span>
                </div>
                <div style="margin-top:9px; font-size:11.5px; color:#5C667C; line-height:1.25;">${card.next}</div>
              </div>
            `).join('')}
            ${cards.length === 0 ? `<div class="empty-state" style="padding:28px 10px; font-size:12px;">Sem oportunidades</div>` : ''}
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;

      // attach extra listeners if needed
    }

    let draggedId = null;
    function dragStart(ev, id) { draggedId = id; ev.dataTransfer.setData('text/plain', id); }
    function allowDrop(ev) { ev.preventDefault(); }
    function dropCard(ev) {
      ev.preventDefault();
      const id = draggedId || ev.dataTransfer.getData('text/plain');
      const col = ev.currentTarget || (ev.target && ev.target.closest ? ev.target.closest('.kanban-col') : null);
      if (!col || !id) return;
      const newStage = col.dataset.stage;

      const card = state.pipeline.find(p => p.id === id);
      if (!card || card.stage === newStage) return;

      const oldStage = card.stage;
      card.stage = newStage;
      card.updated = 'agora';

      // live re-render
      const container = document.getElementById('content-area');
      renderPipeline(container);

      showToast(`Movido para ${newStage.toUpperCase()}: ${card.empresa}`);

      // If moved to fechado, optionally add to implantacoes (simulate conversion)
      if (newStage === 'fechado' && !state.implantacoes.find(i => i.empresa === card.empresa)) {
        setTimeout(() => {
          state.implantacoes.unshift({
            id: 'c' + Date.now(),
            empresa: card.empresa,
            contato: card.contato,
            setor: card.setor,
            funcionarios: card.funcionarios,
            etapaAtual: 1,
            progress: 14,
            risk: 2.1,
            health: 71,
            updated: 'agora',
            etapas: [
              {n:1,nome:'Cadastro',status:'em_andamento',data:'hoje'},
              {n:2,nome:'Proposta',status:'pendente',data:''},
              {n:3,nome:'Contrato',status:'pendente',data:''},
              {n:4,nome:'Sensibilização',status:'pendente',data:''},
              {n:5,nome:'Diagnóstico',status:'pendente',data:''},
              {n:6,nome:'Relatórios',status:'pendente',data:''},
              {n:7,nome:'Apresentação',status:'pendente',data:''}
            ],
            atividades: 1, proxima: 'Iniciar cadastro completo'
          });
          showToast('Empresa convertida! Adicionada à Gestão de Implantação.');
          if (window.currentView === 'implantacao') {
            renderImplantacao(document.getElementById('content-area'));
          }
        }, 800);
      }
    }

    function setPipelineFilter(f) {
      state.pipelineFilter = f;
      renderPipeline(document.getElementById('content-area'));

      const nome = prompt('Nome da empresa (ex: "Fábrica Nova Era"):', 'Nova Empresa Ltda');
      if (!nome) return;
      const newCard = {
        id: 'p' + Date.now(),
        stage: 'lead',
        empresa: nome,
        contato: 'Contato novo',
        email: 'contato@novaempresa.com.br',

        valor: 2800,
        prob: 20,
        setor: 'Indústria',
        next: 'Primeiro contato agendado',
        updated: 'agora'
      };
      state.pipeline.unshift(newCard);
      renderPipeline(document.getElementById('content-area'));
      showToast('Nova oportunidade adicionada no estágio Lead');
    }

            <div style="font-size:13px;">${card.email}</div>
            <div style="margin-top:14px;">
              <div class="eyebrow">Setor / Tamanho</div>
              <div>${card.setor} • ${card.funcionarios} colaboradores</div>
            </div>
          </div>
          <div>
            <div class="eyebrow">Valor mensal</div>
            <div style="font-size:26px; font-weight:700;">${formatBRL(card.valor)}</div>
            <div style="margin-top:10px;"><span class="pill pill-brand">${card.prob}% probabilidade</span></div>
          </div>
        </div>
        <div style="margin:18px 0;">
          <div class="eyebrow">Próximo passo</div>
          <input id="next-step-input" class="input" style="width:100%; margin-top:6px;" value="${card.next}">
        </div>
        <div>
          <div class="eyebrow">Mover para estágio</div>
          <div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;">
            ${['lead','proposta','contrato','aceita','fechado'].map(s => `<button onclick="movePipelineStage('${id}','${s}')" class="btn btn-sm ${card.stage===s?'btn-primary':'btn-secondary'}">${s}</button>`).join('')}
          </div>
        </div>
      `;

      footer.innerHTML = `
        <button onclick="savePipelineDetail('${id}'); closeModal();" class="btn btn-primary">Salvar alterações</button>
        <button onclick="closeModal()" class="btn btn-secondary">Fechar</button>
      `;
      document.getElementById('modal-backdrop').style.display = 'flex';
    }

    function movePipelineStage(id, newStage) {
      const card = state.pipeline.find(p => p.id === id);
      if (!card) return;
      card.stage = newStage;
      card.updated = 'agora';
      closeModal();
      const c = document.getElementById('content-area');
      renderPipeline(c);
      showToast(`Oportunidade movida para ${newStage}`);
    }

    function savePipelineDetail(id) {
      const card = state.pipeline.find(p => p.id === id);
      const input = document.getElementById('next-step-input');
      if (card && input) card.next = input.value;
      closeModal();
      renderPipeline(document.getElementById('content-area'));
    }

    // ============================================================
    // GESTÃO DE IMPLANTAÇÃO (Stepper + timeline)
    // ============================================================
    function getFilteredImplantacoes() {
      let list = [...state.implantacoes];
      if (state.searchTerm) {
        const q = state.searchTerm;
        list = list.filter(c => c.empresa.toLowerCase().includes(q) || c.contato.toLowerCase().includes(q));
      }
      if (state.implantFilter !== 'all') {
        if (state.implantFilter === 'em_andamento') list = list.filter(c => c.etapaAtual < 7);
        if (state.implantFilter === 'finalizando') list = list.filter(c => c.etapaAtual >= 6);
      }
      return list;
    }

    function renderImplantacao(container, isRefresh = false) {
      const list = getFilteredImplantacoes();

      let html = `
        <div class="filter-bar">
          <div class="seg-control">
            <div onclick="setImplantFilter('all')" class="seg-btn ${state.implantFilter==='all'?'active':''}">Todos</div>
            <div onclick="setImplantFilter('em_andamento')" class="seg-btn ${state.implantFilter==='em_andamento'?'active':''}">Em andamento</div>
            <div onclick="setImplantFilter('finalizando')" class="seg-btn ${state.implantFilter==='finalizando'?'active':''}">Finalizando</div>
          </div>
          <input class="input" style="width:260px;" placeholder="Filtrar por empresa..." oninput="filterImplantList(this.value)">
          <div style="margin-left:auto; font-size:12px; color:#5C667C;">${list.length} projetos</div>
        </div>

        <div style="display:flex; flex-direction:column; gap:18px;">
      `;

      list.forEach(c => {
        const stepHtml = renderMiniStepper(c);
        html += `
          <div class="card" style="padding:20px 24px;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div>
                <div style="font-size:17px; font-weight:700;">${c.empresa}</div>
                <div style="font-size:13px; color:#5C667C;">${c.contato} • ${c.setor} • ${c.funcionarios} colaboradores</div>
              </div>
              <div style="text-align:right;">
                <div class="pill ${c.etapaAtual === 7 ? 'pill-success' : 'pill-brand'}">Etapa ${c.etapaAtual} de 7</div>
                <div style="font-size:12px; margin-top:4px;">${c.progress}% concluído</div>
              </div>
            </div>

            <div style="margin: 16px 0 12px;">
              ${stepHtml}
            </div>

            <div style="display:flex; align-items:center; gap:12px; font-size:13px;">
              <div class="muted">Atualizado ${c.updated}</div>
              <div style="flex:1"></div>
              <div><span class="pill pill-info">${c.atividades} pendentes</span></div>
              <div style="color:#3C4A63; font-weight:600;">${c.proxima}</div>
              <button onclick="openImplantDetail('${c.id}')" class="btn btn-secondary btn-sm">Gerenciar</button>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      if (list.length === 0) html = `<div class="empty-state">Nenhuma implantação encontrada.</div>`;

      container.innerHTML = html;
    }

    function renderMiniStepper(c) {
      let out = `<div class="stepper">`;
      c.etapas.forEach((e, idx) => {
        const cls = e.status === 'concluida' ? 'completed' : (e.status === 'em_andamento' ? 'current' : '');
        const icon = e.status === 'concluida' ? '✓' : (e.status === 'em_andamento' ? (idx+1) : (idx+1));
        out += `<div class="step ${cls}">
          <div class="step-circle">${icon}</div>
          <div class="step-label">${e.nome}</div>
        </div>`;
      });
      out += `</div>`;
      return out;
    }

    function setImplantFilter(f) {
      state.implantFilter = f;
      renderImplantacao(document.getElementById('content-area'));
    }
    function filterImplantList(val) {
      state.implantSearch = val.toLowerCase();
      // simple client filter
      const container = document.getElementById('content-area');
      const list = state.implantacoes.filter(c =>
        (!state.implantSearch || c.empresa.toLowerCase().includes(state.implantSearch) || c.contato.toLowerCase().includes(state.implantSearch))
        && (state.implantFilter === 'all' ||
           (state.implantFilter==='em_andamento' && c.etapaAtual<7) ||
           (state.implantFilter==='finalizando' && c.etapaAtual>=6))
      );
      // re-render a filtered view quickly (reuse the render logic)
      renderImplantacao(container);
    }

    function openImplantDetail(id) {
      const c = state.implantacoes.find(x => x.id === id);
      if (!c) return;

      const title = document.getElementById('modal-title');
      const body = document.getElementById('modal-body');
      const footer = document.getElementById('modal-footer');

      title.textContent = c.empresa + ' — Implantação NR-1';

      let stepsHtml = `<div style="margin:14px 0 6px; display:flex; gap:6px; flex-wrap:wrap;">`;
      c.etapas.forEach((e, i) => {
        const cls = e.status === 'concluida' ? 'pill-success' : e.status === 'em_andamento' ? 'pill-brand' : 'pill';
        stepsHtml += `<span onclick="advanceStep('${c.id}', ${i})" class="pill ${cls}" style="cursor:pointer; padding:6px 14px; font-size:12px;">${i+1}. ${e.nome} ${e.status==='concluida'?'✓': e.status==='em_andamento'?'•':''}</span>`;
      });
      stepsHtml += `</div>`;

      body.innerHTML = `
        <div style="display:flex; gap:22px;">
          <div style="flex:1.1;">
            <div class="eyebrow">Status atual</div>
            <div style="font-size:15px; font-weight:700;">Etapa ${c.etapaAtual} — ${c.etapas[c.etapaAtual-1].nome}</div>
            <div class="muted" style="margin-top:2px;">Progresso geral: <strong>${c.progress}%</strong></div>

            <div style="margin-top:16px;">
              <div class="eyebrow">Linha do tempo</div>
              ${c.etapas.map((e, idx) => `
                <div style="display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid #F6F7FA;">
                  <div style="width:22px; text-align:center; font-weight:700; color:${e.status==='concluida'?'#1F9D55': e.status==='em_andamento' ? '#F66B0A' : '#838DA0'};">${idx+1}</div>
                  <div style="flex:1; font-weight:600;">${e.nome}</div>
                  <div style="font-size:12px; color:#5C667C; min-width:72px; text-align:right;">${e.data || '—'}</div>
                </div>
              `).join('')}
            </div>
          </div>
          <div style="flex:1; border-left:1px solid #E7EAF1; padding-left:20px;">
            <div class="eyebrow">Indicadores</div>
            <div style="margin: 10px 0 18px;">
              <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:3px;"><span>Risco psicossocial</span><strong style="color:${c.risk>2.5?'var(--danger)':c.risk>2?'var(--warning)':'var(--success)'}">${c.risk}</strong></div>
              <div class="progress"><span style="width:${Math.max(0, Math.min(100, (4 - c.risk)/4 * 100))}%"></span></div>
              <div style="font-size:11px; margin-top:2px; color:#838DA0;">Meta NR-1 &lt; 2.5</div>
            </div>

            <div class="eyebrow">Próxima ação</div>
            <div style="font-weight:600; margin:4px 0 16px;">${c.proxima}</div>

            <div class="eyebrow">Atividades abertas</div>
            <div style="margin-top:6px; font-size:13px;">${c.atividades} itens pendentes</div>

            <div style="margin-top:22px;">
              <button onclick="advanceStep('${c.id}')" class="btn btn-primary btn-sm" style="width:100%;">Avançar para próxima etapa</button>
            </div>
          </div>
        </div>
      `;

      footer.innerHTML = `
        <button onclick="markCurrentComplete('${c.id}'); closeModal();" class="btn btn-secondary">Marcar etapa atual como concluída</button>
        <button onclick="closeModal()" class="btn btn-primary">Fechar</button>
      `;
      document.getElementById('modal-backdrop').style.display = 'flex';
    }

    function advanceStep(id, specificIdx = null) {
      const c = state.implantacoes.find(x => x.id === id);
      if (!c) return;

      let idx = specificIdx !== null ? specificIdx : c.etapaAtual - 1;

      // advance logic
      if (c.etapas[idx].status === 'pendente') {
        // make previous concluded if jumping
        for (let k=0; k<idx; k++) if (c.etapas[k].status !== 'concluida') c.etapas[k].status = 'concluida';
        c.etapas[idx].status = 'em_andamento';
        c.etapaAtual = idx + 1;
      } else if (c.etapas[idx].status === 'em_andamento') {
        c.etapas[idx].status = 'concluida';
        c.etapas[idx].data = 'hoje';
        if (idx + 1 < c.etapas.length) {
          c.etapas[idx+1].status = 'em_andamento';
          c.etapaAtual = idx + 2;
        }
      } else if (c.etapas[idx].status === 'concluida' && idx + 1 < c.etapas.length) {
        // jump forward
        c.etapas[idx+1].status = 'em_andamento';
        c.etapaAtual = idx + 2;
      }

      // recalc progress
      const done = c.etapas.filter(e => e.status === 'concluida').length;
      c.progress = Math.round((done / c.etapas.length) * 100);

      closeModal();
      const cont = document.getElementById('content-area');
      renderImplantacao(cont);
      showToast('Etapa atualizada. Progresso recalculado.');
    }

    function markCurrentComplete(id) {
      const c = state.implantacoes.find(x => x.id === id);
      if (!c) return;
      const idx = c.etapaAtual - 1;
      c.etapas[idx].status = 'concluida';
      c.etapas[idx].data = 'hoje';
      if (idx + 1 < c.etapas.length) {
        c.etapas[idx + 1].status = 'em_andamento';
        c.etapaAtual = idx + 2;
      }
      const done = c.etapas.filter(e => e.status === 'concluida').length;
      c.progress = Math.round((done / 7) * 100);
      closeModal();
      renderImplantacao(document.getElementById('content-area'));
      showToast('Etapa marcada concluída.');
    }

    // ============================================================
    // MODAL + INIT
    // ============================================================
    function closeModal() {
      document.getElementById('modal-backdrop').style.display = 'none';
    }

    function init() {
      // seed a couple of closed deals already converted in implantacoes if needed
      window.currentView = 'dashboard';

      const content = document.getElementById('content-area');
      renderDashboard(content);

      // keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.key === '/' && document.activeElement.tagName === 'BODY') {
          e.preventDefault();
          document.getElementById('global-search').focus();
        }
        if (e.metaKey && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          const v = window.currentView || 'dashboard';
          if (v === 'pipeline') navigateTo('implantacao');
          else if (v === 'implantacao') navigateTo('dashboard');
          else navigateTo('pipeline');
        }
      });

      // initial toast hint
      setTimeout(() => {
        showToast('Protótipo funcional: arraste cards no Pipeline • avance etapas na Implantação');
      }, 1600);

      // Make nav items reflect current on load
      setTimeout(() => {
        const dash = document.getElementById('nav-dashboard');
        if (dash) dash.classList.add('active');
      }, 30);

      // expose for debugging
      window.MENCTOR_STATE = state;
    }

    // Boot
    init();
  </script>
</body>
</html>
